[project]
name = "logistics-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic==2.12.3", "jsonschema==4.25.1", "pymongo==4.15.3", "redis==6.4.0", "PyMuPDF==1.26.5", "Pillow==11.3.0", "python-dotenv==1.1.1"]

[project.optional-dependencies]
inference = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1", "bitsandbytes==0.48.1", "accelerate==1.10.1"]
ocr = ["paddleocr==3.2.0", "paddlepaddle==3.2.0"]
download = ["huggingface-hub==0.35.3"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
